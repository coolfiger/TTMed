# TTMed Nginx configuration — Hestia compatible
# Copy to /etc/nginx/conf.d/domains/ttmed.app.conf
# and /etc/nginx/conf.d/domains/ttmed.app.ssl.conf

# Redirect all HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name ttmed.app *.ttmed.app;
    return 301 https://$host$request_uri;
}

# Tenant subdomains: *.ttmed.app
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name *.ttmed.app;

    ssl_certificate     /home/coolfiger/conf/web/ttmed.app/ssl/ttmed.app.pem;
    ssl_certificate_key /home/coolfiger/conf/web/ttmed.app/ssl/ttmed.app.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    root /home/coolfiger/web/ttmed.app/public_html/public;
    index index.php;

    client_max_body_size 20M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { log_not_found off; access_log off; }
    location = /robots.txt  { log_not_found off; access_log off; }

    location ~ /\. { deny all; }
    location ~ /(storage|bootstrap/cache) { deny all; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm-ttmed.app.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/ttmed-tenant-access.log;
    error_log  /var/log/nginx/ttmed-tenant-error.log;
}

# Platform admin: platform.ttmed.app
