[program:ttmed-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/ttmed/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --queue=default,notifications,backups
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/supervisor/ttmed-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=90

[program:ttmed-scheduler]
process_name=%(program_name)s
command=php /var/www/ttmed/artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/ttmed-scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[group:ttmed]
programs=ttmed-worker,ttmed-scheduler
